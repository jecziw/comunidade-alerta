# ─────────────────────────────────────────────────────────────
# nginx-ratelimit.conf
# Vai em /etc/nginx/conf.d/ (fora do bloco server, no contexto http)
#
# Define as zonas usadas pelo nginx-https.conf. Sem este arquivo,
# o nginx acusa "unknown limit_req zone" e nao sobe.
# ─────────────────────────────────────────────────────────────

# 5 req/min por IP no login — trava tentativa de forca bruta
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# 60 req/min por IP no restante da API
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# Responde 429 (limite atingido) em vez de 503
limit_req_status 429;
