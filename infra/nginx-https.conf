# ─────────────────────────────────────────────────────────────
# nginx-https.conf — substitui o default.conf apos emitir o certificado
# Troque SEU-DOMINIO pelo dominio real antes de usar.
# ─────────────────────────────────────────────────────────────

# HTTP -> redireciona tudo para HTTPS
server {
    listen 80;
    server_name SEU-DOMINIO www.SEU-DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU-DOMINIO www.SEU-DOMINIO;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index comunidade-alerta.html;

    # ── Cabecalhos de seguranca ──────────────────────────────
    # HSTS: obriga o navegador a usar HTTPS nos proximos acessos
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://unpkg.com https://*.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org https://unpkg.com ws: wss:; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Freio contra forca bruta no login ────────────────────
    # 5 tentativas por minuto por IP, com folga de 5 em rajada.
    # Sem isto, da para testar senha indefinidamente.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:3000/api/auth/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket precisa dos cabecalhos de upgrade — e SO ele.
    # Aplicar "Connection: upgrade" em /api/ tambem era desnecessario.
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / { try_files $uri $uri/ /comunidade-alerta.html; }
}
